<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SOLANA Staking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f11;
      color: #e0e0ff;
      font-family: system-ui, sans-serif;
      padding: 16px;
      min-height: 100vh;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    h1 {
      font-weight: 700;
      font-size: 26px;
      background: linear-gradient(90deg, #00ffaa, #5e81ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { color: #8a8ab8; font-size: 14px; }

    .card {
      background: rgba(20, 20, 30, 0.6);
      border: 1px solid rgba(94, 129, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 15px;
    }
    .label { color: #8a8ab8; }
    .value { font-weight: 500; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      margin: 8px 0;
    }
    .btn-connect {
      background: linear-gradient(90deg, #5e81ff, #00ffaa);
      color: #0f0f11;
    }
    .btn-primary { background: #00ffaa; color: #0f0f11; }
    .btn-outline {
      background: transparent;
      border: 1px solid #5e81ff;
      color: #5e81ff;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    input {
      flex: 1;
      padding: 14px;
      background: rgba(10, 10, 20, 0.7);
      border: 1px solid rgba(94, 129, 255, 0.3);
      border-radius: 8px;
      color: #e0e0ff;
      font-size: 16px;
    }

    .status {
      text-align: center;
      padding: 16px;
      color: #8a8ab8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SOLANA Staking</h1>
      <p class="subtitle">Stake ETH or USDC on Sepolia → Earn SOLANA</p>
    </header>

    <div class="card" id="connectCard">
      <button class="btn btn-connect" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <div class="card" id="mainUI" style="display:none;">
      <div class="info-row">
        <span class="label">Account</span>
        <span class="value" id="account">—</span>
      </div>
      <div class="info-row">
        <span class="label">Reward</span>
        <span class="value"><span id="reward">0.0000</span> SOL</span>
      </div>
    </div>

    <div id="actionCards" style="display:none;">
      <div class="card">
        <button class="btn btn-primary" onclick="stakeETH(0.1)">Stake 0.1 ETH</button>
        <button class="btn btn-outline" onclick="stakeETH(0.5)">Stake 0.5 ETH</button>
      </div>

      <div class="card">
        <div class="input-group">
          <input type="number" id="usdcAmount" placeholder="USDC amount" min="1">
          <button class="btn btn-primary" style="width:auto;padding:14px 16px;" onclick="stakeUSDC()">Stake USDC</button>
        </div>
      </div>

      <div class="card">
        <button class="btn btn-primary" onclick="claim()">Claim SOLANA</button>
        <button class="btn btn-outline" onclick="unstakeETH()">Unstake ETH</button>
        <div class="input-group" style="margin-top:12px;">
          <input type="number" id="unstakeUsdcAmount" placeholder="Unstake USDC">
          <button class="btn btn-outline" style="width:auto;padding:14px 16px;" onclick="unstakeUSDC()">Unstake</button>
        </div>
      </div>
    </div>

    <div class="status" id="status">Connect wallet to begin</div>
  </div>

  <!-- ✅ Ethers v6 - CDN yang 100% aman di Vercel & GitHub -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.12.0/dist/ethers.umd.min.js"></script>

  <script>
    // ✅ GANTI DENGAN ALAMAT KONTRAKMU
    const STAKING_ADDR = "0xbb0eb8C1868cC952C27F639F0030D79b680A0B54";
    const SOLANA_ADDR = "0x5e60dD5b746f6E2a2e2777C8e09E59B589F0Cd71";
    const USDC_ADDR = "0x1c7D4B196cB0C7B01D743Fbc6116a902379c7238";

    let signer, contract;

    async function connectWallet() {
      if (typeof window.ethereum === 'undefined') {
        document.getElementById("status").innerText = "❌ MetaMask not detected";
        return;
      }
    
      try {
        // ✅ Ambil chainId langsung dari MetaMask
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        
        if (chainId !== '0xaa36a7') { // 0xaa36a7 = 11155111 dalam hex
          document.getElementById("status").innerText = "❌ Switch to Sepolia Testnet";
          // ✅ Opsional: auto-switch ke Sepolia
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: '0xaa36a7' }]
            });
            location.reload(); // reload setelah switch
          } catch (switchError) {
            // Jika belum ditambahkan, tambahkan manual
            if (switchError.code === 4902) {
              await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [{
                  chainId: '0xaa36a7',
                  chainName: 'Sepolia Testnet',
                  nativeCurrency: { name: 'SepoliaETH', symbol: 'ETH', decimals: 18 },
                  rpcUrls: ['https://rpc.sepolia.org'],
                  blockExplorerUrls: ['https://sepolia.etherscan.io']
                }]
              });
              location.reload();
            }
          }
          return;
        }
    
        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        const account = await signer.getAddress();
    
        const contractABI = [
          "function stakeETH() payable",
          "function stakeUSDC(uint256)",
          "function unstakeETH()",
          "function unstakeUSDC(uint256)",
          "function claim()",
          "function pendingReward(address) view returns (uint256)"
        ];
        contract = new ethers.Contract(STAKING_ADDR, contractABI, signer);
    
        document.getElementById("account").innerText = account.substring(0,6)+"..."+account.substring(38);
        document.getElementById("connectCard").style.display = "none";
        document.getElementById("mainUI").style.display = "block";
        document.getElementById("actionCards").style.display = "block";
        document.getElementById("status").innerText = "✅ Connected to Sepolia";
        updateReward();
        setInterval(updateReward, 15000);
      } catch (e) {
        let msg = e.message || e.reason || "Connection failed";
        if (msg.includes("user rejected")) msg = "Connection rejected";
        document.getElementById("status").innerText = "❌ " + msg;
      }
    }

    async function updateReward() {
      try {
        const account = await signer.getAddress();
        const reward = await contract.pendingReward(account);
        document.getElementById("reward").innerText = parseFloat(ethers.formatUnits(reward, 9)).toFixed(4);
      } catch (e) { /* ignore */ }
    }

    async function stakeETH(amount) {
      showStatus("Staking ETH...");
      try {
        const tx = await contract.stakeETH({ value: ethers.parseEther(amount.toString()) });
        await tx.wait();
        showStatus("✅ Staked!");
        updateReward();
      } catch (e) { showError(e); }
    }

    async function stakeUSDC() {
      const amount = document.getElementById("usdcAmount").value;
      if (!amount || amount <= 0) return showError("Enter valid USDC amount");
      showStatus("Approving USDC...");
      try {
        const usdc = new ethers.Contract(USDC_ADDR, ["function approve(address,uint256)"], signer);
        const value = ethers.parseUnits(amount, 6);
        await (await usdc.approve(STAKING_ADDR, value)).wait();
        showStatus("Staking USDC...");
        const tx = await contract.stakeUSDC(value);
        await tx.wait();
        showStatus("✅ Staked!");
        updateReward();
      } catch (e) { showError(e); }
    }

    async function claim() {
      showStatus("Claiming SOLANA...");
      try {
        const tx = await contract.claim();
        await tx.wait();
        showStatus("✅ Claimed!");
        updateReward();
      } catch (e) { showError(e); }
    }

    async function unstakeETH() {
      showStatus("Unstaking ETH...");
      try {
        const tx = await contract.unstakeETH();
        await tx.wait();
        showStatus("✅ Unstaked!");
      } catch (e) { showError(e); }
    }

    async function unstakeUSDC() {
      const amount = document.getElementById("unstakeUsdcAmount").value;
      if (!amount || amount <= 0) return showError("Enter valid amount");
      showStatus("Unstaking USDC...");
      try {
        const value = ethers.parseUnits(amount, 6);
        const tx = await contract.unstakeUSDC(value);
        await tx.wait();
        showStatus("✅ Unstaked!");
      } catch (e) { showError(e); }
    }

    function showStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    function showError(e) {
      console.error(e);
      let msg = e.reason || e.message || "Transaction failed";
      if (msg.length > 60) msg = msg.substring(0,60) + "...";
      document.getElementById("status").innerText = "⚠️ " + msg;
    }
  </script>
</body>
</html>
