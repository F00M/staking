<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SOLANA Staking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a10, #0f0f14, #07070c);
      color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-weight: 800;
      font-size: 26px;
      background: linear-gradient(90deg, #00ffaa, #5e81ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .subtitle { 
      color: #7a7aa8; 
      font-size: 13px; 
      font-weight: 500;
    }

    .card {
      background: rgba(20, 20, 30, 0.55);
      border: 1px solid rgba(0, 255, 170, 0.12);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 0 6px rgba(0, 255, 170, 0.03);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(0, 255, 170, 0.25);
      box-shadow: 
        0 10px 36px rgba(0, 255, 170, 0.12),
        inset 0 0 8px rgba(0, 255, 170, 0.06);
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin: 10px 0;
      color: #8a8ab8;
      transition: color 0.2s;
    }
    .balance-row:hover {
      color: #ffffff;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin: 18px 0;
    }
    input {
      flex: 1;
      padding: 15px;
      background: rgba(15, 15, 25, 0.7);
      border: 1px solid rgba(0, 255, 170, 0.15);
      border-radius: 10px;
      color: #e0e0ff;
      font-size: 16px;
      outline: none;
      transition: all 0.25s ease;
    }
    input:focus {
      border-color: #00ffaa;
      box-shadow: 0 0 0 2px rgba(0, 255, 170, 0.2);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(90deg, #00cc88, #00ffaa);
      color: #0f0f11;
      font-weight: 700;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(0, 255, 170, 0.35);
    }
    .btn-primary:active {
      transform: scale(1);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(94, 129, 255, 0.3);
      color: #5e81ff;
    }
    .btn-outline:hover {
      background: rgba(94, 129, 255, 0.08);
      transform: translateY(-1px);
    }

    .status {
      text-align: center;
      padding: 16px;
      color: #00ffaa;
      font-size: 13px;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-weight: 600;
    }

    .reward-highlight {
      color: #00ffaa;
      font-weight: 800;
      text-shadow: 0 0 8px rgba(0, 255, 170, 0.3);
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SOLANA Staking</h1>
      <p class="subtitle">Stake ETH → Earn SOLANA</p>
    </header>

    <div class="card" id="connectCard">
      <button class="btn btn-primary" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <div class="card" id="mainUI" style="display:none;">
      <div class="balance-row">
        <span>ETH Balance:</span>
        <span id="ethBalance">—</span>
      </div>
      <div class="balance-row">
        <span>Staked ETH:</span>
        <span id="stakedEth">0.0000</span>
      </div>
      <div class="balance-row">
        <span>Your Reward:</span>
        <span><b id="reward" class="reward-highlight">0.000</b> SOL</span>
      </div>
    </div>

    <div id="actionUI" style="display:none;">
      <div class="input-group">
        <input type="number" id="ethAmount" placeholder="Amount (ETH)" min="0.01" step="0.1">
      </div>
      <button class="btn btn-primary" id="stakeBtn" onclick="stakeETH()">Stake ETH</button>
      <button class="btn btn-outline" id="unstakeBtn" onclick="unstakeETH()">Unstake All ETH</button>
      <button class="btn btn-primary" id="claimBtn" style="margin-top:12px;" onclick="claim()">Claim SOLANA</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.12.0/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.0.4/dist/countUp.min.js"></script>
  <script>
    const STAKING_ADDR = "0xF588814c24DfD8C1ed7bD36404b5e110e3206Ae7";
    const SOLANA_ADDR = "0x5e60dD5b746f6E2a2e2777C8e09E59B589F0Cd71";

    let signer, contract, ethBalance = 0;

    // ✅ TOAST STATUS BARU
    function showStatus(msg, isError = false) {
      const statusEl = document.getElementById("status");
      statusEl.innerText = msg;
      statusEl.style.color = isError ? "#ff6b6b" : "#00ffaa";
      statusEl.style.opacity = "1";
      setTimeout(() => {
        statusEl.style.opacity = "0";
      }, 3000);
    }

    function setBtnLoading(id, loading, text = "") {
      const btn = document.getElementById(id);
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = `<span class="loading-spinner"></span>${text || "Processing..."}`;
      } else {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.original || btn.innerText;
        if (!btn.dataset.original) btn.dataset.original = btn.innerText;
      }
    }

    function formatSOL(value) {
      if (value >= 1) {
        return Math.floor(value).toLocaleString();
      } else {
        return value.toFixed(3);
      }
    }

    async function connectWallet() {
      if (typeof window.ethereum === 'undefined') {
        showStatus("❌ MetaMask not detected", true);
        return;
      }

      try {
        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        if (chainId !== '0xaa36a7') {
          showStatus("❌ Switch to Sepolia", true);
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: '0xaa36a7' }]
            });
            location.reload();
          } catch (e) {
            if (e.code === 4902) {
              await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [{
                  chainId: '0xaa36a7',
                  chainName: 'Sepolia Testnet',
                  nativeCurrency: { name: 'SepoliaETH', symbol: 'ETH', decimals: 18 },
                  rpcUrls: ['https://rpc.sepolia.org'],
                  blockExplorerUrls: ['https://sepolia.etherscan.io']
                }]
              });
              location.reload();
            }
          }
          return;
        }

        const provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();

        const contractABI = [
          "function stakeETH() payable",
          "function unstakeETH()",
          "function claim()",
          "function pendingReward(address) view returns (uint256)",
          "function stakers(address) view returns (uint256, uint256, uint256)",
          "function withdrawTokens(address, uint256)",
          "function setRewardRate(uint256)"
        ];
        contract = new ethers.Contract(STAKING_ADDR, contractABI, signer);

        document.getElementById("connectCard").style.display = "none";
        document.getElementById("mainUI").style.display = "block";
        document.getElementById("actionUI").style.display = "block";
        showStatus("✅ Connected");

        updateAll();
        setInterval(updateAll, 60000);
      } catch (e) {
        let msg = e.message || e.reason || "Connection failed";
        if (msg.includes("user rejected")) msg = "Connection rejected";
        showStatus("❌ " + msg, true);
      }
    }

    async function updateBalances() {
      try {
        const account = await signer.getAddress();
        const ethBal = await signer.provider.getBalance(account);
        ethBalance = parseFloat(ethers.formatEther(ethBal));
        document.getElementById("ethBalance").innerText = ethBalance.toFixed(4) + " ETH";
      } catch (e) { }
    }

    async function updateStakerData() {
      try {
        const account = await signer.getAddress();
        const data = await contract.stakers(account);
        const ethStaked = data && data[0] ? parseFloat(ethers.formatEther(data[0])) : 0;
        document.getElementById("stakedEth").innerText = ethStaked.toFixed(4) + " ETH";
      } catch (e) {
        document.getElementById("stakedEth").innerText = "0.0000 ETH";
      }
    }

    let rewardInterval;
    
    async function updateReward() {
      try {
        const account = await signer.getAddress();
        const rewardWei = await contract.pendingReward(account);
        const sol = parseFloat(ethers.formatUnits(rewardWei, 18));
        const formatted = formatSOL(sol);
    
        document.getElementById("reward").innerText = formatted;
    
        // Jika reward > 0, mulai interval update tiap detik
        if (sol > 0) {
          if (!rewardInterval) {
            rewardInterval = setInterval(async () => {
              try {
                const updatedRewardWei = await contract.pendingReward(account);
                const updatedSol = parseFloat(ethers.formatUnits(updatedRewardWei, 18));
                const updatedFormatted = formatSOL(updatedSol);
                document.getElementById("reward").innerText = updatedFormatted;
              } catch (e) {
                clearInterval(rewardInterval);
                rewardInterval = null;
              }
            }, 1000); // update tiap 1 detik
          }
        } else {
          if (rewardInterval) {
            clearInterval(rewardInterval);
            rewardInterval = null;
          }
        }
      } catch (e) {
        document.getElementById("reward").innerText = "0.000";
        if (rewardInterval) {
          clearInterval(rewardInterval);
          rewardInterval = null;
        }
      }
    }

    async function updateAll() {
      await updateBalances();
      await updateStakerData();
      await updateReward();
    }

    async function stakeETH() {
      const amount = document.getElementById("ethAmount").value;
      if (!amount || parseFloat(amount) <= 0 || parseFloat(amount) > ethBalance) {
        showStatus("⚠️ Invalid amount or insufficient ETH", true);
        return;
      }
      try {
        setBtnLoading("stakeBtn", true);
        const tx = await contract.stakeETH({ value: ethers.parseEther(amount) });
        await tx.wait();
        showStatus("✅ ETH staked!");
        document.getElementById("ethAmount").value = "";
        await updateAll();
      } catch (e) { showError(e); } finally {
        setBtnLoading("stakeBtn", false);
      }
    }

    async function claim() {
      try {
        setBtnLoading("claimBtn", true, "⏳ Claiming...");
        const tx = await contract.claim();
        await tx.wait();
        showStatus("✅ SOLANA claimed!");
        await updateAll();
      } catch (e) { showError(e); } finally {
        setBtnLoading("claimBtn", false);
      }
    }

    async function unstakeETH() {
      try {
        setBtnLoading("unstakeBtn", true, "⏳ Unstaking...");
        const tx = await contract.unstakeETH();
        await tx.wait();
        showStatus("✅ ETH unstaked!");
        await updateAll();
      } catch (e) { showError(e); } finally {
        setBtnLoading("unstakeBtn", false);
      }
    }

    function showError(e) {
      let msg = e.reason || e.message || "Transaction failed";
      showStatus("⚠️ " + (msg.length > 60 ? msg.substring(0,60)+"..." : msg), true);
      setBtnLoading("stakeBtn", false);
      setBtnLoading("claimBtn", false);
      setBtnLoading("unstakeBtn", false);
    }
  </script>
</body>
</html>
